{% extends 'base.html' %}
{% block title %}
   Home
{% endblock %}
{% block content %}
    <div class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Connect and Collaborate, <br> Making Every Meeting More Meaningful</h1>
            <p class="hero-subtitle">Experience seamless online meetings with real-time insights.</p>
            <a href="{{ url_for('login') }}" class="btn btn-primary px-5 mt-3">Get Started</a>
        </div>
    </div>

    <style>
        /* Hero Section */
        .hero-section {
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        /* Hero Content */
        .hero-content {
            max-width: 850px;
            padding: 40px 50px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
            animation: fadeInUp 0.8s ease-in-out;
        }

        /* Title Styling */
        .hero-title {
            font-size: 2.8rem;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 12px rgba(0, 212, 255, 0.75);
        }

        /* Subtitle */
        .hero-subtitle {
            font-size: 1.2rem;
            color: #cccccc;
            margin-top: 10px;
            line-height: 1.5;
        }

        /* Button Styling */
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0096ff);
            border: none;
            color: #0f0f0f;
            padding: 14px 35px;
            font-size: 1.1rem;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s ease-in-out;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.8);
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            .hero-subtitle {
                font-size: 1rem;
            }
            .btn-primary {
                font-size: 1rem;
                padding: 12px 28px;
            }
            .hero-content {
                padding: 30px;
            }
        }
    </style>
{% endblock %}
